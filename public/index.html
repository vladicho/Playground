<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10251c" />
    <meta name="description" content="Consulte uma biblioteca matemática privada com respostas fundamentadas em fontes." />
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Playground · Biblioteca Matemática</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Página inicial">
          <span class="brand-mark" aria-hidden="true">∑</span>
          <span>
            <strong>Playground</strong>
            <small>Biblioteca Matemática</small>
          </span>
        </a>
        <div class="topbar-actions">
          <span class="status"><i></i> Base conectada</span>
          <button id="clear-chat" class="ghost-button" type="button">Limpar</button>
        </div>
      </header>

      <main id="conversation" class="conversation" aria-live="polite">
        <section class="hero" id="welcome">
          <p class="eyebrow">RAG privado · matemática</p>
          <h1>Pergunte. Calcule.<br /><span>Confira a fonte.</span></h1>
          <p class="hero-copy">
            Respostas em português ou espanhol, fundamentadas nos documentos indexados da sua biblioteca.
          </p>
          <div class="suggestions" aria-label="Perguntas sugeridas">
            <button type="button" data-prompt="Explique um conceito de aritmética encontrado nos documentos e dê um exemplo.">
              <span>01</span> Conceito de aritmética
            </button>
            <button type="button" data-prompt="Encontre um exercício de aritmética nos documentos e resolva passo a passo usando a fonte.">
              <span>02</span> Resolver um exercício
            </button>
            <button type="button" data-prompt="Explique uma ideia de álgebra linear usando apenas os documentos e cite a fonte.">
              <span>03</span> Álgebra linear
            </button>
          </div>
        </section>
      </main>

      <footer class="composer-wrap">
        <form id="chat-form" class="composer">
          <label class="sr-only" for="question">Pergunta</label>
          <textarea
            id="question"
            name="question"
            rows="1"
            maxlength="4000"
            placeholder="Pergunte sobre os documentos…"
            autocomplete="off"
            required
          ></textarea>
          <button id="send-button" class="send-button" type="submit" aria-label="Enviar pergunta">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-4 14-3-6-7-1Zm7 1 3-4" /></svg>
          </button>
        </form>
        <p class="composer-note">A IA pode errar. Confira os cálculos e as fontes.</p>
      </footer>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
